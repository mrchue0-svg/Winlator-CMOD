name: Android CI

on:
  push:
    branches: [ "winlator_bionic" ]
  pull_request:
    branches: [ "winlator_bionic" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v5
      with:
        submodules: recursive
        
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Install dependencies
      run: |
       sudo apt-get update
       sudo apt-get install -y libgl1 libglu1-mesa libc6 lib32z1
       
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Download RYL2 Client
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p app/src/main/assets/ryl2
        gh release download V1.0.0-beta --repo mrchue0-svg/Winlator-CMOD --pattern REMASTERED.rar --dir app/src/main/assets/ryl2

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: "Get Short SHA"
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: "Get Version"
      run: echo "VERSION=$(echo $(cat app/build.gradle.kts | grep versionName | cut -d "=" -f 2 | sed "s/\"//g"))" >> $GITHUB_ENV

    - name: "List files"
      run: |
        ls -la app/src/main/assets
        
    - name: Rename APK
      run: cp app/build/outputs/apk/debug/app-debug.apk ryl2remastered-mobile.apk

    - name: Upload APK
      uses: actions/upload-artifact@v6
      with:
        name: ryl2remastered-mobile
        path: ryl2remastered-mobile.apk
